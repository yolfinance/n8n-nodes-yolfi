name: Publish verified source to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version matching the selected v-prefixed tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'yolfipay/n8n-nodes-yolfi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release target
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p=require("./package.json"); if(p.name!=="n8n-nodes-yolfi" || p.version!==process.env.RELEASE_VERSION || process.env.GITHUB_REF!==`refs/tags/v${p.version}`) process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify npm identity and release availability
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_NPM_USER: ${{ vars.NPM_PUBLISHER }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          test -n "$EXPECTED_NPM_USER"
          test "$(npm whoami --registry=https://registry.npmjs.org)" = "$EXPECTED_NPM_USER"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${p.name}`);
          if (response.status === 404) process.exit(0);
          if (!response.ok) throw new Error('Could not verify npm ownership');
          const metadata = await response.json();
          if (!metadata.maintainers?.some(({name}) => name === process.env.EXPECTED_NPM_USER)) throw new Error('Unexpected npm owner');
          if (metadata.versions?.[p.version]) throw new Error('Version is already published');
          JS
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --ignore-scripts
      - name: Verify public version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(npm view "n8n-nodes-yolfi@$RELEASE_VERSION" version --registry=https://registry.npmjs.org)" = "$RELEASE_VERSION"
